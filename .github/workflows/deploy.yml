name: Deploy to Alwaysdata & Cloudflare

on:
  push:
    branches:
      - main

jobs:
  deploy-alwaysdata:
    name: Deploy to Alwaysdata Runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Deploy to Alwaysdata via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ALWAYSDATA_SSH_HOST }}
          username: ${{ secrets.ALWAYSDATA_SSH_USER }}
          password: ${{ secrets.ALWAYSDATA_SSH_PASSWORD }}
          key: ${{ secrets.ALWAYSDATA_SSH_KEY }}
          port: 22
          script: |
            TARGET_DIR="$HOME/whatsapp-bot-main"
            if [ -d "$HOME/whatsapp-bot" ]; then
              TARGET_DIR="$HOME/whatsapp-bot"
            elif [ -d "$HOME/app" ]; then
              TARGET_DIR="$HOME/app"
            elif [ -d "$HOME/www" ] && [ -f "$HOME/www/package.json" ]; then
              TARGET_DIR="$HOME/www"
            fi

            echo "🚀 Target deployment directory: $TARGET_DIR"

            if [ ! -d "$TARGET_DIR/.git" ]; then
              echo "📥 Repository not initialized on server. Setting up fresh clone..."
              mkdir -p "$TARGET_DIR"
              cd "$TARGET_DIR"
              git init
              git remote add origin https://github.com/${{ github.repository }}.git 2>/dev/null || git remote set-url origin https://github.com/${{ github.repository }}.git
              git fetch origin main
              git reset --hard origin/main
              git checkout -B main origin/main
            else
              cd "$TARGET_DIR"
              echo "📥 Pulling latest commits from origin main..."
              git fetch origin main
              git reset --hard origin/main
            fi

            echo "📦 Installing production dependencies..."
            npm install --omit=dev

            if [ -d "$HOME/www" ] && [ "$TARGET_DIR" != "$HOME/www" ]; then
              echo "🔄 Syncing updated files to $HOME/www..."
              cp -ru "$TARGET_DIR"/* "$HOME/www/" 2>/dev/null || cp -r "$TARGET_DIR"/* "$HOME/www/" 2>/dev/null || true
              cd "$HOME/www" && npm install --omit=dev 2>/dev/null || true
            fi

            echo "🔄 Triggering Alwaysdata process reload..."
            mkdir -p "$TARGET_DIR/tmp" "$HOME/www/tmp" 2>/dev/null || true
            touch "$TARGET_DIR/tmp/restart.txt" "$HOME/www/tmp/restart.txt" 2>/dev/null || true

            echo "✅ Deployment to Alwaysdata finished successfully!"
