<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="WA Bot — Admin Console">
  <title>WA Bot — Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== TOP BAR ===== -->
  <header class="topbar" role="banner">
    <div class="topbar-brand">
      <h1>WA Bot</h1>
      <span class="subtitle">Admin Console</span>
    </div>
    <div class="topbar-right">
      <nav class="nav-desktop" aria-label="Admin navigation">
        <a href="index.html" class="btn btn-sm">Dashboard</a>
        <button type="button" class="btn btn-sm" id="adminSignOutBtn" style="color:var(--danger)">Sign out</button>
      </nav>
      <div class="mobile-nav-container">
        <button type="button" class="hamburger btn btn-sm" id="adminHamburgerBtn" aria-label="Open menu" aria-expanded="false">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect y="2" width="16" height="1.5"/><rect y="7" width="16" height="1.5"/><rect y="12" width="16" height="1.5"/></svg>
        </button>
        <div id="adminMobileMenu" class="mobile-popup hidden" role="menu">
          <a href="index.html" class="menu-item">Dashboard</a>
          <div class="divider"></div>
          <button type="button" class="menu-item danger-text" id="adminMobileSignOutBtn">Sign out</button>
        </div>
      </div>
    </div>
  </header>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="main-content" id="adminMainContent">

    <!-- Tenant User List -->
    <section class="card admin-card" aria-label="Tenant users">
      <div class="card-title">Tenant Users</div>
      <div class="tenant-table-wrap">
        <table class="tenant-table" id="tenantTable">
          <thead>
            <tr>
              <th>Username</th>
              <th>Role</th>
              <th>Owner Number</th>
              <th>AI Provider</th>
              <th>Status</th>
              <th style="text-align:right;">Action</th>
            </tr>
          </thead>
          <tbody id="tenantListBody">
            <!-- Rows injected by JS -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- Create New Tenant User -->
    <section class="card" aria-label="Create tenant user">
      <div class="card-title">Create New Tenant User</div>
      <form id="createUserForm">
        <div class="create-form-grid">
          <div class="field-group">
            <label class="input-label" for="newUsername">Username</label>
            <input class="input" id="newUsername" type="text" name="username" required autocomplete="off">
          </div>
          <div class="field-group">
            <label class="input-label" for="newPassword">Password</label>
            <input class="input" id="newPassword" type="password" name="password" required autocomplete="new-password">
          </div>
          <div class="field-group">
            <label class="input-label" for="newRole">Role</label>
            <select class="select" id="newRole" name="role">
              <option value="user">User</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div class="field-group">
            <label class="input-label" for="newOwnerNumber">Owner WhatsApp Number</label>
            <input class="input" id="newOwnerNumber" type="text" name="owner_number" placeholder="+1234567890">
          </div>
          <div class="field-group" style="grid-column: 1 / -1">
            <label class="input-label" for="newDefaultProvider">Default AI Provider</label>
            <select class="select" id="newDefaultProvider" name="default_provider">
              <option value="nvidia_nim">NVIDIA NIM</option>
              <option value="groq">Groq</option>
              <option value="auto">Auto</option>
            </select>
          </div>
        </div>
        <div id="createUserError" class="login-error" role="alert" aria-live="polite"></div>
        <div class="create-form-actions">
          <button type="submit" class="btn btn-primary" id="btnCreateUser">Create</button>
          <button type="button" class="btn" id="btnCancelCreate">Cancel</button>
        </div>
      </form>
    </section>

  </main>

  <script src="admin.js"></script>
</body>
</html>
