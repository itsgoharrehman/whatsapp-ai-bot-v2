<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Admin console for multi-tenant WhatsApp AI assistant user management." />
  <title>Admin Console — WhatsApp AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <div class="app" id="app" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="brand-name">Admin Console</span>
          <span class="brand-sub">WhatsApp AI · Tenant Management</span>
        </div>
        <span class="topbar-spacer"></span>
        <span class="env-label">Production</span>
        <nav class="nav-desktop" aria-label="Primary">
          <a href="index.html" class="nav-link">Dashboard</a>
          <button type="button" class="btn-ghost" id="btnSignOut">Sign Out</button>
        </nav>
        <button type="button" class="hamburger" id="hamburger" aria-label="Menu" aria-expanded="false" aria-controls="mobileNav">
          <span></span><span></span><span></span>
        </button>
      </div>
      <nav class="mobile-nav" id="mobileNav" aria-label="Mobile">
        <div class="mobile-nav-inner">
          <a href="index.html">Dashboard</a>
          <button type="button" id="btnSignOutM">Sign Out</button>
        </div>
      </nav>
    </header>

    <main class="main" id="main">
      <div class="admin-grid">
        <!-- Create form -->
        <div class="panel">
          <div class="panel-head">
            <span class="panel-title">Create Tenant User</span>
          </div>
          <div class="panel-body">
            <div class="feedback ok" id="adminOk" role="status"></div>
            <div class="feedback err" id="adminErr" role="alert"></div>
            <form id="createUserForm" novalidate>
              <div class="field">
                <label for="newUsername">Username</label>
                <input type="text" id="newUsername" name="username" autocomplete="off" required />
              </div>
              <div class="field">
                <label for="newPassword">Password</label>
                <input type="password" id="newPassword" name="password" autocomplete="new-password" required />
              </div>
              <div class="field">
                <label for="newRole">Role</label>
                <select id="newRole" name="role">
                  <option value="user">User</option>
                  <option value="admin">Admin</option>
                </select>
              </div>
              <div class="field">
                <label for="newOwnerNumber">Owner WhatsApp Number</label>
                <input type="text" id="newOwnerNumber" name="ownerNumber" placeholder="e.g. 15551234567" inputmode="numeric" />
              </div>
              <div class="field">
                <label for="newProvider">Default AI Provider</label>
                <select id="newProvider" name="provider">
                  <option value="auto">Auto</option>
                  <option value="nvidia">NVIDIA NIM</option>
                  <option value="groq">Groq</option>
                </select>
              </div>
              <div class="control-row" style="margin-top:4px;">
                <button type="submit" class="btn-primary" id="btnCreateUser">Create User</button>
                <button type="button" id="btnCancelCreate">Cancel</button>
              </div>
            </form>
          </div>
        </div>

        <!-- User list -->
        <div class="panel">
          <div class="panel-head">
            <span class="panel-title">Tenant Users</span>
            <span class="panel-title-sub" id="userCount" style="margin-left:auto;">0 users</span>
          </div>
          <div class="table-wrap">
            <table class="data" id="userTable">
              <thead>
                <tr>
                  <th scope="col">Username</th>
                  <th scope="col">Role</th>
                  <th scope="col">Owner Number</th>
                  <th scope="col">Provider</th>
                  <th scope="col" style="text-align:right;">Action</th>
                </tr>
              </thead>
              <tbody id="userTableBody">
                <tr><td colspan="5" style="color:var(--text-muted);">Loading users…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="admin.js"></script>
</body>
</html>
